name: Build Linux and Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libblkid-dev liblzma-dev libjsoncpp-dev libsecret-1-dev libssl-dev libwebkit2gtk-4.1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package complete application bundle
        run: tar -czf fluffychat-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-linux-x64
          path: fluffychat-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Make room for Android SDKs and native builds
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/swift
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android SDK components
        run: |
          # Different plugins need different SDK/NDK versions.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Ignore SIGPIPE from yes, but preserve sdkmanager's exit status.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-34' 'platforms;android-35' 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore personal Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            install -d -m 700 "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo '::warning::No ANDROID_DEBUG_KEYSTORE_BASE64 secret: this APK gets a temporary signing key and may not update your existing installation. See docs/automated-builds.md.'
          fi
      - run: flutter pub get
      - name: Build universal APK for phones and emulators
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
